services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: research_document_workspace
      POSTGRES_USER: ${POSTGRES_USER:?Missing POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    cpus: "1.0"
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Missing Mongo username}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Missing Mongo password}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    cpus: "2.0"
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - db.adminCommand('ping').ok
      interval: 5s
      timeout: 10s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Missing MinIO username}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Missing MinIO password}
    volumes:
      - minio_data:/data
    cpus: "1.0"
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:9000/minio/health/live
      interval: 5s
      timeout: 5s
      retries: 20

  restore_tools:
    image: research-document-workspace:dev
    profiles: ["restore-tools"]
    entrypoint: ["python"]
    env_file:
      - .env
    volumes:
      - ./artifacts/backups:/backups:ro
    cpus: "1.0"
    mem_limit: 512m

volumes:
  postgres_data:
  mongo_data:
  mongo_config:
  minio_data: